name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Run tests
        run: ./gradlew test

  instrumented-tests:
    name: Instrumented Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: average phone
            api-level: 34
            arch: x86_64
            target: google_apis
            profile: pixel_5
            cores: 2
            ram-size: 2048M
            heap-size: 512M
          - name: constrained phone
            api-level: 27
            arch: x86
            target: default
            profile: Nexus One
            cores: 1
            ram-size: 1024M
            heap-size: 256M

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram-size }}
          heap-size: ${{ matrix.heap-size }}
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :androidApp:connectedDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: androidApp/build/reports/androidTests/
          if-no-files-found: warn

  ios-framework-build:
    name: iOS Framework Build
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build iOS framework (debug, simulator)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
